{% extends "base.html" %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h2 class="mb-0">Редактирование заявки #{{ application.id }}</h2>
  <a class="btn btn-outline-secondary" href="/applications/{{ application.id }}">Назад к заявке</a>
</div>

<div class="card">
  <div class="card-header">Обновить данные заявки</div>
  <div class="card-body">
    <form method="post" action="/applications/{{ application.id }}/edit" class="row g-3">
      <div class="col-md-4">
        <label class="form-label">Статус</label>
        <select name="status" class="form-select" required>
          <option value="new" {% if application.status == "new" %}selected{% endif %}>Новая</option>
          <option value="approved" {% if application.status == "approved" %}selected{% endif %}>Одобрена</option>
          <option value="rejected" {% if application.status == "rejected" %}selected{% endif %}>Отклонена</option>
          <option value="in_progress" {% if application.status == "in_progress" %}selected{% endif %}>В процессе</option>
          <option value="training_completed" {% if application.status == "training_completed" %}selected{% endif %}>Обучение завершено</option>
          <option value="training_not_completed" {% if application.status == "training_not_completed" %}selected{% endif %}>Обучение не закончено</option>
        </select>
      </div>

      <div class="col-12">
        <label class="form-label">Цель обучения</label>
        <textarea name="goal_text" class="form-control" rows="3">{{ application.goal_text }}</textarea>
      </div>

      <div class="col-12">
        <label class="form-label">Ожидаемый результат</label>
        <textarea name="expected_result_text" class="form-control" rows="3">{{ application.expected_result_text }}</textarea>
      </div>

      <div class="col-12">
        <button type="submit" class="btn btn-primary">Сохранить изменения</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
