{% extends "base.html" %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h2 class="mb-0">Курсы</h2>
</div>

<div class="card mb-4">
  <div class="card-header">Добавить курс</div>
  <div class="card-body">
    <form method="post" action="/courses/create" class="row g-3">
      <div class="col-md-6">
        <label class="form-label">Название</label>
        <input type="text" name="name" class="form-control" required>
      </div>
      <div class="col-md-3">
        <label class="form-label">Формат</label>
        <input type="text" name="format" class="form-control" placeholder="онлайн/офлайн/гибрид" required>
      </div>
      <div class="col-md-3">
        <label class="form-label">Длительность (часы)</label>
        <input type="number" min="1" name="duration_hours" class="form-control" required>
      </div>
      <div class="col-12">
        <label class="form-label">Описание</label>
        <textarea name="description" class="form-control" rows="2" required></textarea>
      </div>

      <div class="col-12">
        <label class="form-label">Компетенции курса</label>
      </div>
      {% for i in range(1, 4) %}
      <div class="col-md-7">
        <select name="competency_id" class="form-select">
          <option value="">Выберите компетенцию (опционально)</option>
          {% for competency in competencies %}
          <option value="{{ competency.id }}">{{ competency.name }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="col-md-5">
        <input type="number" min="1" max="5" name="target_level" class="form-control" placeholder="Целевой уровень 1-5">
      </div>
      {% endfor %}

      <div class="col-12">
        <button type="submit" class="btn btn-primary">Создать курс</button>
      </div>
    </form>
  </div>
</div>

<div class="card mb-4">
  <div class="card-body p-0">
    <table class="table table-striped mb-0">
      <thead>
        <tr>
          <th>ID</th>
          <th>Название</th>
          <th>Формат</th>
          <th>Длительность (часы)</th>
          <th></th>
        </tr>
      </thead>
      <tbody>
        {% for course in courses %}
        <tr>
          <td>{{ course.id }}</td>
          <td>{{ course.name }}</td>
          <td>{{ course.format }}</td>
          <td>{{ course.duration_hours }}</td>
          <td><a class="btn btn-sm btn-outline-primary" href="/courses/{{ course.id }}">Открыть</a></td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
</div>
{% endblock %}
