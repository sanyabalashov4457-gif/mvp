<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HRM MVP</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/static/styles.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
  <div class="container">
    <a class="navbar-brand" href="/applications">HRM MVP</a>
    <div class="navbar-nav">
      <a class="nav-link {% if active_page == 'employees' %}active{% endif %}" href="/employees">Employees</a>
      <a class="nav-link {% if active_page == 'courses' %}active{% endif %}" href="/courses">Courses</a>
      <a class="nav-link {% if active_page == 'applications' %}active{% endif %}" href="/applications">Applications</a>
      <a class="nav-link {% if active_page == 'analytics' %}active{% endif %}" href="/analytics">Analytics</a>
    </div>
  </div>
</nav>

<main class="container pb-5">
  {% block content %}{% endblock %}
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
